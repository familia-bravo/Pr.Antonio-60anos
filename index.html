<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta name="theme-color" content="#071d18">

  <title>60 anos | Uma história para celebrar</title>

  <!-- Fontes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

<link
  href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Serif+Display&family=Inter:wght@300;400;500;600&display=swap"
  rel="stylesheet"
>

  <link rel="stylesheet" href="style.css">
</head>


<body>

  <!-- ============================= -->
  <!-- CAPA DO CONVITE -->
  <!-- ============================= -->

 <section class="hero">

  <!-- Foto com efeito de memória -->
  <div 
    class="hero-photo"
    aria-hidden="true"
  ></div>

  <!-- Tom verde cinematográfico -->
  <div 
    class="hero-overlay"
    aria-hidden="true"
  ></div>

  <!-- Luz dourada -->
  <div 
    class="hero-glow"
    aria-hidden="true"
  ></div>

    <!-- Conteúdo -->
    <div class="hero-content">

      <p class="eyebrow">
        Uma história que merece ser celebrada
      </p>


      <div class="anniversary">

        <span class="number">
          60
        </span>

        <span class="years">
          ANOS
        </span>

      </div>


      <h1>
        Pr. Antônio Carlos Bravo
      </h1>


      <p class="description">
        Uma vida de fé, propósito e histórias para celebrar.
      </p>


      <div class="divider"></div>


      <p class="period">
        1966 <span>—</span> 2026
      </p>


      <a
        href="#experiencia"
        class="celebrate-button"
      >

        <span class="button-text">
          Celebrar conosco
        </span>

        <span
          class="arrow"
          aria-hidden="true"
        >
          ↓
        </span>

      </a>

    </div>

  </section>


  <!-- ============================= -->
  <!-- PRÓXIMA ETAPA -->
  <!-- ============================= -->

  <main id="experiencia">

    <!--
      Na próxima etapa colocaremos aqui:

      - convite
      - data
      - horário
      - localização
      - linha do tempo
      - 20 anos em Sinop
      - confirmação
      - Pix
    -->

  </main>

</body>

</html>
