<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta name="theme-color" content="#071d18">

  <title>60 anos | Uma história para celebrar</title>

  <!-- Fontes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Serif+Display&family=Inter:wght@300;400;500;600&display=swap"
    rel="stylesheet"
  >

  <!-- v=11 força o celular a carregar o CSS novo -->
  <link
    rel="stylesheet"
    href="style.css?v=11"
  >
</head>


<body>

  <main>

    <!-- ============================= -->
    <!-- CAPA DO CONVITE -->
    <!-- ============================= -->

    <section class="hero">

      <!-- Foto -->
      <div
        class="hero-photo"
        aria-hidden="true"
      ></div>

      <!-- Overlay verde -->
      <div
        class="hero-overlay"
        aria-hidden="true"
      ></div>

      <!-- Luz dourada -->
      <div
        class="hero-glow"
        aria-hidden="true"
      ></div>


      <!-- Conteúdo -->

      <div class="hero-content">

        <p class="eyebrow">
          Uma história que merece ser celebrada
        </p>


        <!-- 60 ANOS -->

        <div class="anniversary">

          <span class="number">
            60
          </span>

          <span class="years">
            ANOS
          </span>

        </div>


        <!-- NOME -->

        <h1>
          Pr. Antônio Carlos Bravo
        </h1>


        <!-- DESCRIÇÃO -->

        <p class="description">
          Uma vida de fé, propósito e histórias para celebrar.
        </p>


        <div
          class="divider"
          aria-hidden="true"
        ></div>


        <!-- PERÍODO -->

        <p class="period">
          1966
          <span>—</span>
          2026
        </p>


        <!-- BOTÃO -->

        <a
          href="convite.html"
          class="confirm-button"
        >
          <span>
            Confirmar presença
          </span>

          <span
            class="arrow"
            aria-hidden="true"
          >
            →
          </span>
        </a>

      </div>

    </section>

  </main>

</body>

</html>
